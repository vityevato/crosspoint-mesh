blank_issues_enabled: false
contact_links:
  - name: Scope Question (start here if unsure)
    url: https://github.com/vityevato/crosspoint-mesh/discussions
    about: |
      Not sure if your idea fits CrossPoint Mesh's scope? Start a Discussion before filing an issue.
      See SCOPE.md for what is in and out.
  - name: Read the Scope document
    url: https://github.com/vityevato/crosspoint-mesh/blob/master/SCOPE.md
    about: The authoritative list of what CrossPoint Mesh will and will not accept.
  - name: Reader-related issue or feature request
    url: https://github.com/crosspoint-reader/crosspoint-reader/issues/new/choose
    about: |
      This repository only accepts MeshCore-related issues. For anything about the
      reader itself (rendering, formats, library, settings, themes, sync, etc.),
      file against the upstream CrossPoint Reader project instead.
